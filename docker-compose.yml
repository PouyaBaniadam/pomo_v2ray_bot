services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: pomo2vraybot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  web_admin:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_defaults && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pomov2raybot_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

  telegram_bot:
    build: .
    command: python manage.py runbot
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pomov2raybot_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web_admin
    restart: always

volumes:
  postgres_data: